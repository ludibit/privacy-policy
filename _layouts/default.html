<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | escape }}</title>
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.7; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fafaf8; color: #252b28; }
      main { max-width: 760px; margin: 0 auto; padding: 36px 24px 72px; overflow-wrap: anywhere; }
      .brand { margin: 0 0 24px; color: #4b6256; font-weight: 650; letter-spacing: .04em; }
      h1 { font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.15; letter-spacing: -.035em; }
      h2 { margin-top: 2.2em; line-height: 1.3; font-size: 1.4rem; }
      h3 { margin-top: 1.8em; line-height: 1.4; font-size: 1.1rem; }
      a { color: #246044; text-underline-offset: .18em; }
      a:hover { text-decoration-thickness: 2px; }
      a:focus-visible { outline: 3px solid #a36b19; outline-offset: 4px; border-radius: 2px; }
      li { margin: .5em 0; }
      ul { padding-left: 1.4em; }
      h2, h3 { scroll-margin-top: 24px; }
      footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid #ccd5cf; font-size: .9rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #171d19; color: #e2e9e3; }
        .brand { color: #adc7b5; }
        a { color: #a3d9b6; }
        footer { border-color: #435048; }
      }
      @media print {
        body { background: white; color: black; }
        main { max-width: none; padding: 0; }
        a { color: inherit; }
        h2, h3 { break-after: avoid; }
      }
    </style>
  </head>
  <body>
    <main id="main">
      <p class="brand">Ludibit · Apps &amp; games</p>
      {{ content }}
      <footer>Privacy contact: <a href="mailto:iamludibit@gmail.com">iamludibit@gmail.com</a></footer>
    </main>
  </body>
</html>
